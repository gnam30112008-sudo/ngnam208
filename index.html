<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhật ký tạo video</title>
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--text:#1d1b16;--muted:#6b665c;--line:#e4dfd3;--ok:#1f7a45;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fbe6e4;--run:#8a5a00;--runbg:#fff1d6;--stop:#5c5c66;--stopbg:#ececf0}
@media (prefers-color-scheme:dark){:root{--bg:#14130f;--card:#1e1c17;--text:#efece3;--muted:#a39d8f;--line:#33302a;--ok:#6fd79a;--okbg:#17301f;--bad:#ff8f86;--badbg:#3a1b19;--run:#f2c46b;--runbg:#3a2d10;--stop:#b9b9c4;--stopbg:#2a2a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px 48px}
main{max-width:860px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;line-height:1.2}
.stat b.sm{font-size:1.05rem;line-height:1.5}
.stat span{color:var(--muted);font-size:.85rem}
.list{display:flex;flex-direction:column;gap:10px}
.run{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.title{font-weight:600;overflow-wrap:anywhere}
.badge{flex:none;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.badge.xong{color:var(--ok);background:var(--okbg)}
.badge.loi{color:var(--bad);background:var(--badbg)}
.badge.dang_chay{color:var(--run);background:var(--runbg)}
.badge.gian_doan{color:var(--stop);background:var(--stopbg)}
.meta{color:var(--muted);font-size:.88rem;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px}
.note{margin-top:8px;font-size:.88rem;color:var(--bad);overflow-wrap:anywhere}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:28px;color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Nhật ký tạo video</h1>
  <p class="sub" id="updated">Đang tải…</p>
  <section class="stats" id="stats"></section>
  <section class="list" id="list"></section>
  <footer>Trang tự làm mới mỗi phút. Chỉ hiển thị tiêu đề, thời lượng và trạng thái.</footer>
</main>
<script>
(function () {
  var LABEL = { xong: "Hoàn thành", loi: "Lỗi", dang_chay: "Đang chạy", gian_doan: "Bị gián đoạn" };
  var STALE_MIN = 60; // "đang chạy" quá lâu coi như bị gián đoạn

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text; // textContent: dữ liệu không bao giờ được chạy như HTML
    return e;
  }
  function fmtTime(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" });
  }
  function fmtDur(s) {
    s = Math.round(Number(s) || 0);
    if (!s) return "";
    return s >= 60 ? Math.floor(s / 60) + " phút " + (s % 60) + " giây" : s + " giây";
  }
  function statusOf(r) {
    if (r.status === "dang_chay") {
      var age = (Date.now() - new Date(r.time).getTime()) / 60000;
      if (age > STALE_MIN) return "gian_doan";
    }
    return r.status in LABEL ? r.status : "gian_doan";
  }
  function stat(box, value, label, small) {
    var d = el("div", "stat");
    d.appendChild(el("b", small ? "sm" : "", String(value)));
    d.appendChild(el("span", "", label));
    box.appendChild(d);
  }

  function render(data) {
    var runs = Array.isArray(data.runs) ? data.runs : [];
    var st = data.stats || {};
    document.getElementById("updated").textContent =
      data.updated ? "Cập nhật lúc " + fmtTime(data.updated) : "Chưa có dữ liệu.";

    var box = document.getElementById("stats");
    box.textContent = "";
    stat(box, st.total || 0, "Tổng số lần chạy");
    stat(box, st.ok || 0, "Hoàn thành");
    stat(box, st.failed || 0, "Lỗi");
    stat(box, runs.length ? fmtTime(runs[0].time) : "—", "Lần chạy gần nhất", true);

    var list = document.getElementById("list");
    list.textContent = "";
    if (!runs.length) {
      list.appendChild(el("div", "empty", "Chưa có video nào được ghi nhận."));
      return;
    }
    runs.forEach(function (r) {
      var s = statusOf(r);
      var card = el("article", "run");
      var top = el("div", "top");
      top.appendChild(el("div", "title", r.title || r.topic || "(chưa có tiêu đề)"));
      top.appendChild(el("span", "badge " + s, LABEL[s]));
      card.appendChild(top);
      var meta = el("div", "meta");
      var bits = [fmtTime(r.time), r.scenes ? r.scenes + " cảnh" : "", fmtDur(r.seconds),
                  r.source ? "Nguồn: " + r.source : ""];
      bits.forEach(function (t) { if (t) meta.appendChild(el("span", "", t)); });
      card.appendChild(meta);
      if (s === "loi" && r.note) card.appendChild(el("div", "note", r.note));
      list.appendChild(card);
    });
  }

  function load() {
    fetch("status.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById("updated").textContent = "Không đọc được dữ liệu. Thử tải lại sau.";
      });
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
